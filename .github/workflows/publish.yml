name: Publish to PyPI

# Veroeffentlicht bei jedem GitHub-Release. Kein API-Token noetig:
# PyPI vertraut diesem Workflow ueber OIDC (Trusted Publishing).
# Voraussetzung: auf pypi.org unter Account -> Publishing ein
# "pending publisher" mit genau diesen Werten anlegen --
#   Project: iobroker | Owner: ioBroker
#   Repository: iobroker-python | Workflow: publish.yml | Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Die Version steht nur noch in src/iobroker/__init__.py, pyproject.toml
      # liest sie dort aus -- die beiden koennen also nicht auseinanderlaufen.
      # Was bleibt, ist die Luecke zwischen Release-Tag und Paketversion: man
      # taggt v0.1.2 und hat das Bumpen vergessen. Genau das faengt dieser
      # Schritt ab, bevor PyPI eine falsch benannte Version annimmt.
      - name: Release-Tag gegen Paketversion pruefen
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/iobroker/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' passt nicht zu __version__ '$VERSION'. Version bumpen oder Tag korrigieren."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME stimmt mit Version $VERSION ueberein."

      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Nur echte Releases veroeffentlichen. Damit ist ein manueller Start
    # ueber "Run workflow" ein gefahrloser Trockenlauf: er baut und prueft,
    # ruehrt PyPI aber nicht an -- und PyPI nimmt eine Version ohnehin nie
    # ein zweites Mal an.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Der Token, mit dem sich der Workflow bei PyPI ausweist.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
