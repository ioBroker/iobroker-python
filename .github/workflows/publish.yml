name: Publish to PyPI

# Veroeffentlicht bei jedem GitHub-Release. Kein API-Token noetig:
# PyPI vertraut diesem Workflow ueber OIDC (Trusted Publishing).
# Voraussetzung: auf pypi.org unter Account -> Publishing ein
# "pending publisher" mit genau diesen Werten anlegen --
#   Project: iobroker | Owner: ioBroker
#   Repository: iobroker-python | Workflow: publish.yml | Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Der Token, mit dem sich der Workflow bei PyPI ausweist.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
