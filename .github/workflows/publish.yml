name: Publish to PyPI

# Publishes on every GitHub release. No API token needed: PyPI trusts this
# workflow through OIDC (Trusted Publishing). The matching Trusted Publisher
# is configured on pypi.org under the project's publishing settings --
#   Owner: ioBroker | Repository: iobroker-python
#   Workflow: publish.yml | Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The version lives in src/iobroker/__init__.py only and pyproject.toml
      # reads it from there, so those two cannot drift apart. What remains is
      # the gap between release tag and package version: tagging v0.1.2 while
      # forgetting to bump. This step catches exactly that, before PyPI accepts
      # a misnamed version.
      - name: Check release tag against package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/iobroker/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match __version__ '$VERSION'. Bump the version or fix the tag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $VERSION."

      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Publish real releases only. This turns a manual "Run workflow" start
    # into a harmless dry run: it builds and checks but never touches PyPI --
    # which would reject an already published version anyway.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The token the workflow uses to identify itself to PyPI.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
