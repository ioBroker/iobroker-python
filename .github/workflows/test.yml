name: Test

# Lint plus the full test suite -- including the database tests -- on the same
# OS matrix js-controller tests on. Every job runs against a real Redis;
# IOB_TEST_REQUIRE_REDIS turns a missing server into a failure, so a broken
# Redis setup can never pass as "everything skipped, therefore green".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

      # docs/API.md is generated from the docstrings. Checking it here is what keeps
      # the two from drifting: a docstring edited without regenerating fails the build
      # instead of quietly leaving the reference wrong.
      - run: pip install -e .
      - run: python tools/gen_api.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      IOB_TEST_REQUIRE_REDIS: "1"
      IOB_TEST_REQUIRE_BUILTIN: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The built-in-database backend runs the js-controller jsonl servers as a
      # Node process, so both runtimes are needed on every matrix leg.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the built-in database servers
        working-directory: tests/builtin
        run: npm ci

      - name: Install Redis (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y redis-server
          for _ in $(seq 1 30); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is up"
              exit 0
            fi
            sleep 1
          done
          echo "Redis did not answer PING within 30s"
          exit 1

      - name: Install Redis (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install redis
          # `brew services start` only registers a launchd job and returns before
          # the server listens; start it directly and wait (same lesson as in the
          # js-controller CI).
          redis-server --daemonize yes --logfile "$RUNNER_TEMP/redis.log"
          for _ in $(seq 1 30); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is up"
              exit 0
            fi
            sleep 1
          done
          echo "Redis did not answer PING within 30s"
          cat "$RUNNER_TEMP/redis.log" || true
          exit 1

      - name: Install Redis (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile "$env:RUNNER_TEMP\redis.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\redis.zip" -DestinationPath "$env:RUNNER_TEMP\redis"
          Start-Process -FilePath "$env:RUNNER_TEMP\redis\redis-server.exe"
          $cli = "$env:RUNNER_TEMP\redis\redis-cli.exe"
          for ($i = 0; $i -lt 30; $i++) {
            try {
              if ((& $cli ping) -eq "PONG") { Write-Output "Redis is up"; exit 0 }
            } catch {}
            Start-Sleep 1
          }
          Write-Error "Redis did not answer PING within 30s"
          exit 1

      - name: Install package
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest -v

  # Redis Sentinel, which is the one topology where the database's address is not configuration
  # but an answer that changes while an adapter runs. A master, a replica and a sentinel, then a
  # forced failover -- the only way to find out whether a client really follows the master.
  #
  # Linux only: Sentinel is what a redundant ioBroker installation runs on, and neither the
  # Windows build nor the Homebrew formula is worth a second copy of this to keep working.
  sentinel:
    runs-on: ubuntu-latest
    env:
      IOB_TEST_SENTINELS: 127.0.0.1:26390
      IOB_TEST_SENTINEL_NAME: mymaster
      # A sentinel that did not come up must fail the job. Without this the tests would skip and
      # the job would be green while proving nothing -- the same reason IOB_TEST_REQUIRE_REDIS
      # exists above.
      IOB_TEST_REQUIRE_SENTINEL: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Redis
        run: |
          sudo apt-get update -q
          sudo apt-get install -y redis-server
          sudo systemctl stop redis-server || true

      # Ports well away from 6379: nothing else in this job uses Redis, but a stray default
      # instance from the package must not be mistaken for the master under test.
      - name: Start a master, a replica and a sentinel
        run: |
          mkdir -p "$RUNNER_TEMP/sentinel" && cd "$RUNNER_TEMP/sentinel"
          cat > master.conf <<EOF
          port 6390
          bind 127.0.0.1
          daemonize yes
          dir $RUNNER_TEMP/sentinel
          logfile $RUNNER_TEMP/sentinel/master.log
          dbfilename master.rdb
          EOF
          cat > replica.conf <<EOF
          port 6391
          bind 127.0.0.1
          daemonize yes
          dir $RUNNER_TEMP/sentinel
          logfile $RUNNER_TEMP/sentinel/replica.log
          dbfilename replica.rdb
          replicaof 127.0.0.1 6390
          EOF
          # Quorum 1 with a single sentinel: enough to agree with itself, which is all a forced
          # failover needs. A production setup wants three, but a third of this file would then
          # be sentinel configuration rather than the test.
          cat > sentinel.conf <<EOF
          port 26390
          bind 127.0.0.1
          daemonize yes
          dir $RUNNER_TEMP/sentinel
          logfile $RUNNER_TEMP/sentinel/sentinel.log
          sentinel monitor mymaster 127.0.0.1 6390 1
          sentinel down-after-milliseconds mymaster 5000
          sentinel failover-timeout mymaster 10000
          sentinel parallel-syncs mymaster 1
          EOF
          redis-server master.conf
          redis-server replica.conf
          sleep 1
          redis-server sentinel.conf --sentinel
          for _ in $(seq 1 30); do
            if redis-cli -p 26390 sentinel get-master-addr-by-name mymaster | grep -q 6390; then
              echo "Sentinel monitors the master"
              exit 0
            fi
            sleep 1
          done
          echo "The sentinel setup did not come up"
          tail -n 50 "$RUNNER_TEMP"/sentinel/*.log || true
          exit 1

      - name: Install package
        run: pip install -e .[dev]

      - name: Run the sentinel tests
        run: pytest tests/test_sentinel.py -v
