[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iobroker"
version = "0.1.0"
description = "Python-SDK fuer ioBroker-Adapter -- spricht direkt das Redis-Wire-Protokoll der States- und Objects-Datenbank"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bluefox", email = "dogafox@gmail.com" }]
keywords = ["iobroker", "home-automation", "adapter", "redis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["redis>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
metrics = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/ioBroker/iobroker-python"
Issues = "https://github.com/ioBroker/iobroker-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/iobroker"]

[tool.ruff]
line-length = 100
target-version = "py310"
