[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iobroker"
dynamic = ["version"]
description = "Python SDK for ioBroker adapters -- speaks the Redis wire protocol of the states and objects databases directly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bluefox", email = "dogafox@gmail.com" }]
keywords = ["iobroker", "home-automation", "adapter", "redis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["redis>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "cryptography>=42"]
# Only needed by adapters whose settings contain encrypted fields. Kept optional
# because it is a compiled package, which on a Raspberry Pi is the difference between
# a fast install and a long build.
crypto = ["cryptography>=42"]
metrics = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/ioBroker/iobroker-python"
Issues = "https://github.com/ioBroker/iobroker-python/issues"

# The version lives in src/iobroker/__init__.py only, so the two can never
# drift apart in the first place.
[tool.hatch.version]
path = "src/iobroker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/iobroker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # redis-py deprecations about its own API surface. The SDK's usage is deliberate:
    # setex is what the built-in server understands (SET with EX is not guaranteed),
    # and lib_name/lib_version=None is what suppresses CLIENT SETINFO.
    "ignore:Call to deprecated setex:DeprecationWarning",
    "ignore:Call to '__init__' function with deprecated usage:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# CI installs the newest ruff, and its default rule set grows over time -- an
# explicit selection keeps that from turning the build red without a code
# change. This is ruff's classic default.
select = ["E4", "E7", "E9", "F"]
